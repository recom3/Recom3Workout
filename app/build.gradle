apply plugin: 'com.android.application'

android {
    compileSdkVersion 27
    buildToolsVersion '27.0.3'
    defaultConfig {
        applicationId 'com.recom3.workout'
        minSdkVersion 16
        targetSdkVersion 16
        versionCode project.property('workoutVersionCode').toInteger()
        versionName project.property('workoutVersionName')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

dependencies {
    implementation project(':reconUI')
}

